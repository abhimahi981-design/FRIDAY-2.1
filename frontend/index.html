<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIDAY AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090c10;
      color: #00f2fe;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }
    .status {
      font-size: 0.85rem;
      color: #4facfe;
      margin-top: 4px;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: rgba(16, 26, 43, 0.6);
      border: 1px solid #00f2fe33;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .message {
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .bot-title {
      font-weight: bold;
      color: #ffffff;
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-action {
      background: #16213e;
      color: #00f2fe;
      border: 1px solid #00f2fe66;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .input-bar {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #00f2fe66;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      outline: none;
    }
    .btn-submit {
      background: #00f2fe;
      color: #090c10;
      border: none;
      padding: 10px 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>F.R.I.D.A.Y</h1>
    <div class="status">PERSONAL AI ASSISTANT • SYSTEM ONLINE</div>
  </div>

  <div class="chat-box" id="chat">
    <div class="message">
      <span class="bot-title">FRIDAY:</span> Hello, Boss.<br>
      All systems are online. How may I assist you?
    </div>
  </div>

  <div class="quick-actions">
    <button class="btn-action">TIME</button>
    <button class="btn-action">DATE</button>
    <button class="btn-action">STATUS</button>
    <button class="btn-action">JOKE</button>
    <button class="btn-action">YOUTUBE</button>
    <button class="btn-action">GOOGLE</button>
  </div>

  <div class="input-bar">
    <input type="text" placeholder="Talk to FRIDAY...">
    <button class="btn-submit">🎤</button>
    <button class="btn-submit">SEND</button>
  </div>

</body>
</html>
